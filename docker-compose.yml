version: '3.8'

services:
  ai-education-discount:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-education-discount:latest
    container_name: ai-education-discount
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=admin123456 # 请在生产环境中修改此管理员密码！
      - DB_PATH=/app/data/deals.db
    volumes:
      # 挂载宿主机目录实现 SQLite 数据库持久化
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/deals', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 5s
      retries: 3
