name = "ai-education-discount"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# Cloudflare D1 边缘数据库绑定
# 使用前请执行: wrangler d1 create ai_deals_db 并将生成的 database_id 填入下方
[[d1_databases]]
binding = "DB"
database_name = "ai_deals_db"
database_id = "49074bf6-1f5c-45a8-a410-a558f5930405"

# 环境变量与管理员密码：
# 已解除 wrangler.toml 锁定，你现在可以在 Cloudflare 控制台直接自由添加、修改或删除环境变量：
# 控制台路径: Workers & Pages -> ai-education-discount -> Settings -> Environment variables
# 也可以通过命令行添加加密密文: npx wrangler pages secret put ADMIN_PASSWORD

